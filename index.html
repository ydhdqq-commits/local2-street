<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALLE - Street Culture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
header{padding:20px;display:flex;justify-content:space-between;border-bottom:2px solid #fff;position:sticky;top:0;background:#0a0a0a;z-index:10}
.logo{font-weight:900;font-size:24px;letter-spacing:-1px}
nav a{color:#fff;text-decoration:none;margin-left:15px;font-size:12px;letter-spacing:1px}
.hero{padding:60px 20px;text-align:center;border-bottom:2px solid #fff}
.hero h1{font-size:60px;font-weight:900;line-height:0.9;transform:skew(-5deg)}
.hero p{margin-top:20px;background:#ff0033;display:inline-block;padding:8px 15px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#fff}
.item{background:#111;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;border:2px solid #fff0}
.item:hover{background:#ff0033}
footer{padding:40px;text-align:center;font-size:12px;opacity:.5}
.btn{display:block;margin:30px auto;background:#fff;color:#000;text-align:center;padding:20px;font-weight:900;text-decoration:none;width:80%;max-width:300px}
</style>
</head>
<body>
<header><div class="logo">CALLE.</div><nav><a>SHOP</a><a>DROP</a><a>INFO</a></nav></header>
<div class="hero"><h1>NO<br>SIGAS<br>LA MODA.</h1><p>NUEVO DROP - CORDOBA AR</p></div>
<div class="grid">
<div class="item">HOODIES</div><div class="item">TEES</div>
<div class="item">PANTS</div><div class="item">CAPS</div>
</div>
<a class="btn" href="https://wa.me/5493510000000">PEDIR POR WHATSAPP</a>
<footer>CALLE 2026 - CORDOBA / AR - @CALLE.STREET
<!-- MAPA CORDOBA -->
<section class="mt-10 p-6">
  <h3 class="text-xl font-bold mb-3">📍 Donde estamos</h3>
  <p class="mb-2">Obispo Salguero 741, Nueva Córdoba, Córdoba</p>
  <iframe class="w-full h-64 rounded-2xl" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.9!2d-64.188!3d-31.42!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzHCsDI1JzEyLjAiUyA2NMKwMTEnMTYuOCJX!5e0!3m2!1ses!2sar!4v1" loading="lazy"></iframe>
</section>

<!-- HORARIOS -->
<section class="mt-6 p-6 bg-zinc-900 rounded-2xl">
  <h3 class="font-bold">🕒 Horarios</h3>
  <p>Lun a Sáb: 9:00 a 21:00 - Dom: 10:00 a 14:00</p>
</section>
</footer>
</body>
</html>
